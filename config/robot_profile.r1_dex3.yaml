safety:   # DESIGN §4.2-4.4; never tunable; no rung of the ladder damps (DESIGN §4.3)
  lowstate_age_count_ms:
    value: 10
    unit: ms
    status: modelling_choice
    source: "DESIGN §4.2: lowstate older than 10 ms is counted"
    date: 2026-10-10
  lowstate_age_resend_ms:
    value: 100
    unit: ms
    status: estimate
    source: "DESIGN §4.2 (v2 semantics); v2 r1mc2/controller.py:306 stale_hold_s 0.1 (resend the last command)"
    date: 2026-10-10
    until: "revalidated by the fault-injection tests in the v3 sim (gate G-HW1) and the board hold time (the board-hold test) on HW1"
  lowstate_age_fault_ms:
    value: 1000
    unit: ms
    status: estimate
    source: "DESIGN §4.2; v2 r1mc2/controller.py:307 stale_fault_s 1.0 (v3: fault without limp)"
    date: 2026-10-10
    until: "revalidated in the v3 sim (G-HW1) and by the board-hold test on HW1"
  arm_tilt_stop_deg:
    value: 4
    unit: deg
    status: estimate
    source: "DESIGN §4.2: arm tilt stop 4 deg over the tilt at the start of an arm motion (v2 S10, r1mc2/controller.py:3456-3470; INV App. A §4)"
    date: 2026-10-10
    until: "revalidated in the v3 sim (G-HW1)"
  fall_detect_deg:
    value: 30
    unit: deg
    status: estimate
    source: "DESIGN §4.2: fall detection 30 deg, the policy keeps running, no automatic damp; v2 r1mc2/controller.py:301 tilt_fault_deg 30"
    date: 2026-10-10
    until: "revalidated in the v3 sim (G-HW1)"
  policy_age_inline_ms:
    value: 40
    unit: ms
    status: modelling_choice
    source: "DESIGN §3.1 step 6, §4.3 rung 1: two policy periods at 50 Hz, then the policy runs inline in the writer"
    date: 2026-10-10
  guard_heartbeat_writer_periods:
    value: 5
    unit: periods
    status: modelling_choice
    source: "DESIGN §4.3 rung 2: r1guard takes over when r1rt's heartbeat is older than 5 writer periods (10 ms at 500 Hz)"
    date: 2026-10-10
    notes: "must stay below the board's own hold time, which the board-hold test measures on HW1 (DESIGN §16 K1)"
  takeover_max_tilt_deg:
    value: 12
    unit: deg
    status: estimate
    source: "DESIGN §4.4 v2's proven takeover gates; v2 r1mc2/runtime.py:345-377 (INV App. A §1.1)"
    date: 2026-10-10
    until: "revalidated in the DDS-bridge sim rehearsal (G-HW1)"
  takeover_max_state_age_ms:
    value: 50
    unit: ms
    status: estimate
    source: "v2 takeover gate state age <= 0.05 s, r1mc2/runtime.py:345-377 (INV App. A §1.1)"
    date: 2026-10-10
    until: "revalidated in the DDS-bridge sim rehearsal (G-HW1)"
  takeover_max_dq_rad_s:
    value: 0.5
    unit: rad/s
    status: estimate
    source: "v2 takeover gate max |dq| <= 0.5 rad/s, r1mc2/runtime.py:345-377 (INV App. A §1.1); DESIGN §4.4"
    date: 2026-10-10
    until: "revalidated in the DDS-bridge sim rehearsal (G-HW1)"
  takeover_max_temp_c:
    value: 60
    unit: degC
    status: estimate
    source: "v2 takeover gate max temp < 60 C, r1mc2/runtime.py:345-377, 356-358 (INV App. A §4 S7); DESIGN §4.4"
    date: 2026-10-10
    until: "revalidated with the thermal model (DESIGN §13.1 A4)"
  takeover_release_timeout_s:
    value: 4.0
    unit: s
    status: estimate
    source: "DESIGN §3.5, §4.4: ReleaseMode must succeed within 4 s (v2's sequence, INV App. A §3.3)"
    date: 2026-10-10
    until: "revalidated in the DDS-bridge sim rehearsal (G-HW1)"
  # session 9 (U19 / D25; docs/sim/STATE_AGE.md): the state-age limit + the "hold the stand" rung. The age is always
  # measured (the STATE_OLD alarm, r1 status); the rung stays OFF (0) until the user's OK after the sim evidence.
  state_age_limit_ms:
    value: 10
    unit: ms
    status: modelling_choice
    source: "the user's target 11 Oct 2026 (~10 ms sustained); B7 (session 8): a constant extra 15 ms of latency degrades, 20 ms falls; HW1 T5: lowstate age p99 1.0 / max 3.0 ms; docs/sim/STATE_AGE.md"
    date: 2026-10-11
    until: "HW2: the content age logged with the rung off (no false episodes) before the rung is armed"
  state_age_sustain_ms:
    value: 100
    unit: ms
    status: modelling_choice
    source: "docs/sim/STATE_AGE.md (session 9 sweep): 100 ms = no freeze on a 100 ms loss (harmless today), every simulated fall still caught (delay 40 / 50 ms + a 5 N s push: 0 / 3); the core's built-in default stays 60 ms"
    date: 2026-10-11
    until: "HW2 (log-only first), then the user's OK"
  stale_rung:
    value: 0
    unit: "1"
    status: modelling_choice
    source: "OFF until the user's OK (U19 / D25: built + sim-tested in session 9, then the OK before it is armed on the robot); 1 = hold the stand, 2 = hold the stand then return to the policy"
    date: 2026-10-11
  stale_return_live_ms:
    value: 500
    unit: ms
    status: modelling_choice
    source: "docs/sim/STATE_AGE.md: stale_rung 2 returns to the policy after the state has been live this long (and the freeze ramp ended)"
    date: 2026-10-11

executor:   # DESIGN §3.3
  keepalive_ms:
    value: 50
    unit: ms
    status: modelling_choice
    source: "DESIGN §3.3: r1d renews a TRAJECTORY keepalive every 50 ms"
    date: 2026-10-10
  trajectory_stop_time_s:
    value: 0.15
    unit: s
    status: modelling_choice
    source: "DESIGN §3.3: on keepalive expiry decelerate to a stop within the configured stop time (default 150 ms), then HOLD"
    date: 2026-10-10
  stream_ttl_max_arm_s:
    value: 0.3
    unit: s
    status: modelling_choice
    source: "DESIGN §3.3: STREAM messages carry a TTL <= 300 ms for the arms (v2 arm.twist / arm.jog ttl 0.3, INV §4)"
    date: 2026-10-10
  speed_scale:
    value: 1.0
    bounds: {min: 0.1, max: 1.0}
    tunable: true
    status: modelling_choice
    source: "DESIGN §3.3 speed control on the trajectory clock; v2 `limits` speed_scale 0.1-1.0 (INV App. B §1.2)"
    date: 2026-10-10

processes:   # session 6: the r1rt / r1guard values the sections above do not cover; never tunable (safety / timing).
  # With rates, limits, gains, safety and executor above this is the WHOLE robot config file (python -m r1mc3.rtconfig
  # --profile robot; each written key's provenance goes to <file>.provenance.json). The policy interface (ONNX metadata),
  # its weights and the stand pose stay the repository's / the model's - see python/r1mc3/rtconfig.py ROBOT_KEPT.
  stand_freeze_ramp_s:
    value: 0.4
    unit: s
    status: modelling_choice
    source: "DESIGN §3.5 STAND_FREEZE ramp 0.3-0.5 s; the user's decision U3 / DESIGN D15 (10 Oct 2026): 0.4 s kept until the HW1 fast-ramp test (HW1_RUNBOOK_ADDITIONS S5); r1sim/v3_core.py STAND_RAMP_S"
    date: 2026-10-10
  takeover_blend_stand_s:
    value: 1.0
    unit: s
    status: modelling_choice
    source: "DESIGN §3.5: blend into ours over 0.3 s (walk) / 1.0 s (stand); D22 / U13 (10 Oct 2026): ON_STAND's 1 s blend into a stiff hold; r1sim/v3_core.py TAKEOVER_BLEND_S"
    date: 2026-10-10
  damp_kd:
    unit: N*m*s/rad
    status: reported
    source: "DESIGN §3.5 DAMP (kp 0, kd 3 legs, arms 1-3); v2 r1mc2/joints.py:79-80 KD_DAMP (3.0 everywhere, head 1.0) - the damping v2's operator damp used on hardware"
    date: 2026-10-10
    until: "HW1: the operator's damp at the session end (E2) on the stand, the legs' fall speed watched"
    value:
      left_hip_pitch: 3.0
      left_hip_roll: 3.0
      left_hip_yaw: 3.0
      left_knee: 3.0
      left_ankle_pitch: 3.0
      left_ankle_roll: 3.0
      right_hip_pitch: 3.0
      right_hip_roll: 3.0
      right_hip_yaw: 3.0
      right_knee: 3.0
      right_ankle_pitch: 3.0
      right_ankle_roll: 3.0
      waist_roll: 3.0
      waist_yaw: 3.0
      left_shoulder_pitch: 3.0
      left_shoulder_roll: 3.0
      left_shoulder_yaw: 3.0
      left_elbow: 3.0
      left_wrist_roll: 3.0
      right_shoulder_pitch: 3.0
      right_shoulder_roll: 3.0
      right_shoulder_yaw: 3.0
      right_elbow: 3.0
      right_wrist_roll: 3.0
      head_pitch: 1.0
      head_yaw: 1.0
  on_stand_hold_gains:
    value: stiff
    status: modelling_choice
    source: "DESIGN §3.5 ON_STAND 'stiff hold by default'; D22 / U13 (10 Oct 2026): a 1 s blend into a stiff hold of the measured pose; 'stiff' = gains.stiff above (written as all-zero on_stand_kp / on_stand_kd: the core's convention for 'the stand gains', step_api.h)"
    date: 2026-10-10
  action_abs_max:
    value: 50.0
    status: derived
    source: "the raw network output never left +-40 on the policy golden sets (S2: |action| max 39.7, random inputs); r1sim/v3_core.py ACTION_ABS_MAX - beyond it the action is invalid (rung 3, STAND_FREEZE)"
    date: 2026-10-10
  builtin_max_age_ms:
    value: 100
    unit: ms
    status: estimate
    source: "takeover / ON_STAND gate 'the built-in's rt/lowcmd fresh' (DESIGN §4.4 v2's gate: built-in lowcmd fresh and stiff; INV App. A §1.1); r1sim/v3_core.py BUILTIN_MAX_AGE_S"
    date: 2026-10-10
    until: "HW1 B1.2: the built-in's rt/lowcmd rate measured read-only"
  builtin_min_leg_kp:
    value: 10.0
    status: estimate
    source: "takeover gate 'the built-in visibly holding' (DESIGN §4.4); the stand lock's 200 and the built-in's walk 84 / 31 are well above it (r1sim/v3_core.py BUILTIN_MIN_LEG_KP); ON_STAND does not apply it (Unitree's damping on the stand, D22)"
    date: 2026-10-10
    until: "HW1 B1.2: the built-in's leg kp read on rt/lowcmd in MONITOR"
  mirror_max_dev_rad:
    value: 0.6
    unit: rad
    status: modelling_choice
