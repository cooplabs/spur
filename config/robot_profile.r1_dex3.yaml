    value: 500
    unit: Hz
    bounds: {min: 200, max: 1000}
    status: modelling_choice
    source: "DESIGN §0 D7 / §0.1 D7 (user decision 10 Oct 2026): RT writer 500 Hz, configurable 200-1000, 200 Hz fallback; Unitree's examples write lowcmd at 500 Hz (RESEARCH §0 item 7)"
    date: 2026-10-10
  writer_fallback_hz:
    value: 200
    unit: Hz
    status: modelling_choice
    source: "DESIGN §0.1 D7: 200 Hz fallback if the stock kernel cannot hold 500 Hz (v2 ran 200 Hz live, INV §1)"
    date: 2026-10-10
  policy_hz:
    value: 50
    unit: Hz
    status: derived
    source: "the balance policy's training rate: physics 5 ms x decimation 4 (INV App. E §3.2, policy params/env.yaml)"
    date: 2026-10-09
  hands_hz:
    value: 100
    unit: Hz
    status: reported
    source: "Unitree's Dex3 clients (xr_teleoperate Dex3_1_Controller) at 100 Hz (v2 r1mc2/dex3.py:41-44); DESIGN §0 D7"
    date: 2026-10-01
    until: "hand state rate measured on HW1 (INV App. E §5: 85-89 Hz vs ~800 Hz across probes)"
  executor_hz:
    value: 100
    unit: Hz
    status: modelling_choice
    source: "DESIGN §0 D7: executor 100 Hz"
    date: 2026-10-10

