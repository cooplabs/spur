# Robot profile: Unitree R1 (26 body joints, mode_machine 1) + two Dex3-1 hands.
# Validated by r1mc3.config.load_profile (YAML -> validated -> frozen). Every value carries its provenance.
# Only fields with `tunable: true` (and bounds) may change at runtime; anything else needs `version` raised.
# Start values taken from v2 (r1mc2, git r21_try 2a4a165) are marked `estimate` until revalidated (sim / HW1).
# Doc references: docs/DESIGN.md (DESIGN), docs/V2_INVENTORY.md (INV); v2 paths are relative to r1-motor-controller-v2.
schema: r1mc3.robot_profile/1
name: r1_dex3
version: 2
description: "Unitree R1 + two Dex3-1 hands; version 2 (session 6): the `processes` section added - the source of the robot's r1rt / r1guard config file (python -m r1mc3.rtconfig --profile robot)"

