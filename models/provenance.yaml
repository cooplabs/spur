# Provenance of every parameter of the simulator's robot model (r1sim/model.py, r1sim/dex3.py, r1sim/joints.py).
# status: official (a Unitree file) | measured (on our robot / kit) | derived (computed from other entries) |
#         reported (a secondary source, not re-measured) | estimate (our guess) | modelling_choice (a deliberate
#         simulator setting). `until` says what replaces an estimate / reported value. tests/unit/test_provenance_model.py
# checks that the values below equal the code's constants.
schema: r1mc3.provenance/1
