# Sensor-model parameters of r1sim (sim/r1sim/sensors.py, SensorConfig: parameter id = field name). Same schema as
# models/provenance.yaml (r1mc3.config.load_provenance). Almost everything here is an ESTIMATE: v2's logs are 8 Hz and
# hold no dq / tau_est / gyro / acc / raw taxels (V2_INVENTORY App. E §0 item 2), so encoder, IMU and pad noise are
# placeholders until the full-rate HW1 recordings (DESIGN §12.7 Tier B); the thermal constants are fitted in A4
# (session 3, 13 h of logged temperature + load). tests/unit/test_sensors.py checks this file = SensorConfig().
schema: r1mc3.provenance/1
parameters:
  # ------------------------------------------------------------------ encoders (body)
  q_noise_std:
    value: 2.0e-4
    unit: rad
    status: estimate
    source: "white noise on the joint angle; v2's simulator used 1e-3 (backends/sim.py:415), training randomised +-0.01 uniform (env.yaml observation noise, App. E §3.5) - both are robustness margins, not measurements"
    date: 2026-10-10
    until: "HW1 static holds at full rate (std of q at rest per joint)"
    range: [0.0, 1.0e-3]
    range_source: "0 = ideal encoder .. v2's simulator value"
  q_quant:
    value: 3.0e-5
    unit: rad
    status: estimate
    source: "joint-side encoder step: a 15-bit rotor encoder behind ~6:1 gearing (Unitree GO-M8010 class; the R1's own motor encoders are not documented). The logs round q to 1e-4 rad (App. E §1.4), which hides it"
    date: 2026-10-10
    until: "HW1 full-rate q histograms at rest"
    range: [0.0, 2.0e-4]
    range_source: "0 .. a 15-bit encoder on the joint itself (2 pi / 2^15)"
  q_bias_std:
    value: 0.0
    unit: rad
    status: estimate
    source: "per-joint zero-calibration offset, drawn once per seed; nominal 0 (no evidence of offsets on our robot); training randomised encoder_bias +-0.015 (App. E §3.6)"
    date: 2026-10-10
    until: "HW1 joint zero check against the URDF zero pose"
    range: [0.0, 0.015]
    range_source: "training encoder_bias randomisation bound"
  dq_noise_std:
    value: 0.02
    unit: rad/s
    status: estimate
    source: "v2's simulator value (backends/sim.py:416); training randomised +-1.5 uniform (App. E §3.5)"
    date: 2026-10-10
    until: "HW1 full-rate dq at rest"
    range: [0.0, 0.1]
    range_source: "0 .. 5x v2's simulator value"
  # ------------------------------------------------------------------ encoders (hands)
  hand_q_noise_std:
    value: 0.002
    unit: rad
    status: estimate
    source: "v2's simulator hand q noise (backends/sim.py:438)"
    date: 2026-10-10
    until: "HW1 hand state at rest (rt/dex3/*/state at full rate)"
    range: [0.0, 0.005]
    range_source: "0 .. 2.5x v2's value"
  hand_q_quant:
    value: 0.0
    unit: rad
    status: estimate
    source: "Dex3-1 encoder resolution not documented; not modelled by default"
    date: 2026-10-10
    until: "HW1 hand q histograms at rest"
    range: [0.0, 0.0015]
    range_source: "0 .. a 12-bit encoder on the joint (2 pi / 4096)"
  hand_dq_noise_std:
    value: 0.02
    unit: rad/s
    status: estimate
    source: "as the body (no hand data)"
    date: 2026-10-10
    until: "HW1 hand state at rest"
    range: [0.0, 0.1]
    range_source: "as the body"
  # ------------------------------------------------------------------ IMU (at the model's imu site)
  gyro_noise_std:
    value: 0.01
    unit: rad/s
    status: estimate
    source: "v2's simulator value (backends/sim.py:417); not in the logs (App. E §0 item 2)"
    date: 2026-10-10
    until: "HW1 IMU statics at full rate"
    range: [0.002, 0.03]
    range_source: "typical MEMS gyro white noise at 500 Hz .. 3x v2's value"
  gyro_bias_std:
    value: 0.003
    unit: rad/s
    status: estimate
    source: "per-seed constant gyro bias after the IMU's own start-up calibration (typical MEMS); no R1 data"
    date: 2026-10-10
    until: "HW1 IMU statics (mean gyro at rest)"
    range: [0.0, 0.01]
    range_source: "0 .. an uncalibrated MEMS gyro"
  gyro_bias_rw:
    value: 0.0
    unit: rad/s/sqrt(s)
    status: estimate
    source: "gyro bias random walk; off by default (minutes-scale, irrelevant for 60 s runs)"
    date: 2026-10-10
    until: "HW1 IMU statics over >= 10 min"
    range: [0.0, 1.0e-3]
    range_source: "0 .. a consumer MEMS gyro"
  acc_noise_std:
    value: 0.05
    unit: m/s^2
    status: estimate
    source: "accelerometer white noise (typical MEMS at 500 Hz); no R1 data"
    date: 2026-10-10
    until: "HW1 IMU statics at full rate"
    range: [0.01, 0.2]
    range_source: "typical MEMS range"
  acc_bias_std:
    value: 0.05
    unit: m/s^2
    status: estimate
    source: "per-seed constant accelerometer bias (typical calibrated MEMS)"
    date: 2026-10-10
    until: "HW1 IMU statics (mean acc at rest vs g)"
    range: [0.0, 0.2]
    range_source: "typical MEMS range"
  quat_noise_std:
    value: 0.002
    unit: rad
    status: estimate
    source: "random rotation per sample of the orientation output; v2's simulator value (backends/sim.py:418-423)"
    date: 2026-10-10
    until: "HW1 IMU statics (quaternion jitter at rest)"
    range: [0.0, 0.005]
    range_source: "0 .. 2.5x v2's value"
  quat_bias_std:
    value: 0.0035
    unit: rad
    status: estimate
    source: "per-seed constant rotation of the reported orientation, ON TOP of the model's IMU mounting offset (models/provenance.yaml imu_mount_offset_deg, session 4): the session-to-session variation of the IMU - legs difference around it, std over six sessions' quiet-stance means 0.20 deg pitch / 0.08 deg roll (r1sim.tier_a.a9_short_grasps.stance_imu_offset + the 9 Oct fall session) - the 0.2 deg of the session-2 estimate (mount / filter error) agrees"
    date: 2026-10-10
    until: "HW1: IMU tilt vs the base levelled on the stand (docs/hardware/HW1_IMU_LEVEL.md)"
    range: [0.0, 0.0175]
    range_source: "0 .. 1 deg"
  # ------------------------------------------------------------------ tau_est (body)
  tau_scale:
    value: 1.0
    status: estimate
    source: "body tau_est = scale x the applied torque; no calibration of the R1 body tau_est exists (the logs hold no tau_est, App. E §0 item 2)"
    date: 2026-10-10
    until: "HW1 static payload poses (tau_est vs gravity torque)"
    range: [0.8, 1.2]
    range_source: "+-20 %, a typical current-based torque estimate error"
  tau_noise_std:
    value: 0.05
    unit: N m
    status: estimate
    source: "white noise on the body tau_est; no data"
    date: 2026-10-10
    until: "HW1 full-rate tau_est at rest"
    range: [0.0, 0.3]
    range_source: "0 .. 0.5 % of the 60 N m effort limit"
  tau_junk_p:
    value: 0.0
    status: estimate
    source: "probability per sample and motor of a junk body tau_est; no evidence of junk on the body (the logged 'junk' was the hands' raw units, see hand_tau_units)"
    date: 2026-10-10
    until: "HW1 full-rate logs"
    range: [0.0, 1.0e-3]
    range_source: "0 .. one junk sample per motor per 2 s at 500 Hz"
  tau_junk_abs:
    value: 1674.594
    unit: N m
    status: measured
    source: "magnitude of a junk reading: the idle open hand's tau_est read as N m on 7 Oct (4 raw steps of 418.65; V2_INVENTORY App. D HG-13; v2 hands.py:86-90)"
    date: 2026-10-07
  # ------------------------------------------------------------------ tau_est (hands)
  hand_tau_gain:
    value: 1.0
    status: measured
    source: "session 3 (A8/A10): the calibrated reading IS kp x (q_cmd - q) per joint - the 7 Oct calibration fitted raw tau_est against exactly that at static stalls, 1.000e-6 N m per raw (x0.998-1.003), R^2 1.0, 12 motors (results/hand-tau-20261007T175324Z run.log). v2's '1.0-1.4 N m at the 0.6 N m squeeze, ~2x kp x error' (hands.py:455-458, HG-16) compared v2's finger_torque_nm - the SUM of a finger's two closing joints (hands.py grip(): tq = tp + td), each at kp 1.5 x 0.4 = 0.6 N m, 1.2 N m together - with ONE joint's command: the sum reads 0.83-1.17x, not 2x. Was 2.0 (S2, from that comment); with 2.0 v2's false hold read 7.7-14.7 N in the sim vs the real 5.24 / 5.5 N"
    date: 2026-10-10
    until: "HW1 finger closing on known objects / pad presses with known weights (Tier B)"
    range: [0.8, 1.2]
    range_source: "1.0-1.4 N m read for the 1.2 N m two-joint sum (0.83-1.17x) and the calibration's 0.998-1.003x"
  hand_tau_noise_std:
    value: 0.001
    unit: N m
    status: measured
    source: "residual of the 7 Oct hand tau calibration fit: rms 0.7-1.0 mN m (hand-tau-20261007T175324Z, App. E §1.5)"
    date: 2026-10-07
    range: [0.0007, 0.005]
    range_source: "the fit's rms .. 5x"
  hand_tau_units:
    value: "nm"
    status: modelling_choice
    source: "nm = the calibrated reading in N m (what v2 used after hands.load_tau_scale); raw = the hand service's units (what rt/dex3/*/state carries)"
    date: 2026-10-10
  hand_tau_nm_per_raw:
    value: 1.0e-6
    unit: N m
    status: measured
    source: "7 Oct calibration: 0.998-1.003e-6 N m per raw unit, R^2 = 1.0, 6/7 motors per hand (App. E §1.5)"
    date: 2026-10-07
  hand_tau_raw_step:
    value: 418.65
    status: measured
    source: "every raw tau_est the hand probes logged (4-7 Oct) is a whole multiple of ~418.65 (v2 hands.py:86-90; App. E §1.5)"
    date: 2026-10-07
  hand_tau_thumb0_raw:
    value: 8498.6
    status: estimate
    source: "thumb_0's raw tau_est in the 7 Oct calibration samples (not fitted: 1 static sample of 4 needed); v2 backends/sim.py:46 SIM_TAU_JUNK_RAW"
    date: 2026-10-07
    until: "HW1 thumb_0 calibration with >= 4 static samples"
  hand_tau_junk_p:
    value: 0.0
    status: estimate
    source: "probability per sample and motor of a junk hand reading; no rate evidence (HG-13's junk was raw units read as N m, which hand_tau_units raw reproduces)"
    date: 2026-10-10
    until: "HW1 full-rate hand logs"
    range: [0.0, 1.0e-3]
    range_source: "0 .. one junk sample per motor per second at ~1 kHz"
  hand_tau_junk_abs:
    value: 1674.594
    unit: N m
    status: measured
    source: "as tau_junk_abs (HG-13)"
    date: 2026-10-07
  # ------------------------------------------------------------------ pads (Dex3 PressSensorState: 9 pads x 12 slots)
  pads:
    value: true
    status: modelling_choice
    source: "pads computed from contact forces when the hands have pad boxes (real profile)"
    date: 2026-10-10
  pad_baseline_pa:
    value: 101325.0
    unit: Pa
    status: estimate
    source: "the pads report absolute pressure (manual: >= 1e5 valid; v2 hands.py Tactile docstring); v2's simulator used 101325 (backends/sim.py:491)"
    date: 2026-10-10
    until: "HW1 pad readings at rest"
    range: [100000.0, 103000.0]
    range_source: "the manual's valid floor .. a high ambient reading"
  pad_no_data:
    value: 30000.0
    unit: Pa
    status: official
    source: "Dex3-1 User Manual: 30000 = no data (r1sim.dex3.NO_DATA)"
    date: 2026-10-01
  pad_cell_area_m2:
    value: 1.2e-5
    unit: m^2
    status: estimate
    source: "area per taxel of a 2x2 pad (~3.5 x 3.5 mm), v2 backends/sim.py:489-492 (3 Oct: so a ~10 g touch registers as on the real Dex3-1)"
    date: 2026-10-03
    until: "HW1 pad presses with known weights"
    range: [0.6e-5, 2.4e-5]
    range_source: "x0.5 .. x2"
  tip_cell_area_m2:
    value: 0.9e-5
    unit: m^2
    status: estimate
    source: "area per taxel of a 3x1 tip pad (~3 x 3 mm), v2 backends/sim.py:489-492"
    date: 2026-10-03
    until: "HW1 pad presses with known weights"
    range: [0.45e-5, 1.8e-5]
    range_source: "x0.5 .. x2"
  pad_gain:
    value: 1.0
    status: estimate
    source: "reported pressure per ideal pressure (force / area); the Pa -> N map of the real pads is unknown (App. E §1.4: no reference force)"
    date: 2026-10-10
    until: "HW1 pad presses with known weights"
    range: [0.5, 2.0]
    range_source: "x0.5 .. x2"
  pad_min_force_n:
    value: 0.098
    unit: N
    status: official
    source: "Dex3-1 manual: 10 g - 2.5 kg per taxel (lower bound); v2 backends/sim.py:489-490"
    date: 2026-10-03
  pad_max_force_n:
    value: 24.5
    unit: N
    status: official
    source: "Dex3-1 manual: 2.5 kg per taxel (upper bound)"
    date: 2026-10-03
  pad_noise_std_pa:
    value: 100.0
    unit: Pa
    status: estimate
    source: "white noise per cell; v2's simulator used 25 Pa (backends/sim.py:494); the real contact threshold adapts to the noise at tare with a 1.5 kPa floor (v2 hands.py Tactile)"
    date: 2026-10-10
    until: "HW1 raw pad readings at rest"
    range: [25.0, 500.0]
    range_source: "v2's value .. a third of the 1.5 kPa contact floor"
  pad_offset_std_pa:
    value: 500.0
    unit: Pa
    status: estimate
    source: "per-seed constant offset per cell from the baseline (removed by a tare)"
    date: 2026-10-10
    until: "HW1 raw pad readings at rest"
    range: [0.0, 3000.0]
    range_source: "0 .. the stale-tare offsets seen (1.57-3.8 kPa, v2 hands.py:236-244)"
  pad_shape_drift_pa:
    value: 600.0
    unit: Pa
    status: reported
    source: "the finger pads' zero moves with the finger shape: open <-> preshape up to 0.6 kPa (8 Oct, session 10; v2 hands.py:236-238); modelled per unit closure of the pad's finger"
    date: 2026-10-08
    until: "HW1 tare per hand shape"
    range: [0.0, 3000.0]
    range_source: "0 .. the 2.2-3.8 kPa false touches of session 10"
  pad_heat_drift_pa_per_c:
    value: 190.0
    unit: Pa/C
    status: reported
    source: "thumb_pad 0.8 -> 5.6 kPa during a 63-65 C hold (v2 hands.py:239-241): ~4.8 kPa over ~25 C above pad_heat_ref_c; applied with the finger's hottest motor"
    date: 2026-10-08
    until: "HW1 / A10 hot-hold pad logs"
    range: [0.0, 400.0]
    range_source: "0 .. 2x the reported slope"
  pad_heat_ref_c:
    value: 40.0
    unit: C
    status: estimate
    source: "hand temperature below which the pads do not drift (hands idle at 38-45 C, App. E §1; SR-10 starts at 40 C)"
    date: 2026-10-10
    until: "A10 hot-hold pad logs"
    range: [35.0, 45.0]
    range_source: "the idle hand temperatures seen"
  pad_glitch_p:
    value: 2.0e-5
    status: estimate
    source: "single-frame thumb_pad glitches of 254-421 kPa were seen (V2_INVENTORY App. D HG-11); their rate is not known: probability per pad per sample"
    date: 2026-10-10
    until: "HW1 raw pad logs at full rate"
    range: [0.0, 1.0e-3]
    range_source: "0 .. one glitch per pad per 10 s at ~100 Hz"
  pad_glitch_min_pa:
    value: 254000.0
    unit: Pa
    status: measured
    source: "HG-11: single-frame thumb_pad glitches 254-421 kPa (lower end)"
    date: 2026-10-08
  pad_glitch_max_pa:
    value: 421000.0
    unit: Pa
    status: measured
    source: "HG-11 (upper end)"
    date: 2026-10-08
  pad_face_margin_m:
    value: 0.002
    unit: m
    status: modelling_choice
    source: "a contact on a finger's own link shape counts for its pad within the pad's in-plane extent + this margin (v2 backends/sim.py _on_pad, pad_model 'real')"
    date: 2026-10-07
  # ------------------------------------------------------------------ thermal (two poles per motor; A4, session 3)
  thermal:
    value: true
    status: modelling_choice
    source: "a parallel two-pole thermal model per motor, T = T_amb + idle_rise + D_fast + D_slow, tau_k dD_k/dt = -D_k + G_k u (u = tau^2 body, |tau|^1.5 hands). One pole (S2) could not fit the logs: the reported temperature follows load in seconds (hip roll 36 -> 59 C in ~30 s at ~24 N m, 5 Oct 23:09Z) on top of a housing drift of tens of minutes"
    date: 2026-10-10
  body_ambient_c:
    value: 23.3
    unit: C
    status: derived
    source: "mean of the per-session ambients fitted in A4 (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C)"
    date: 2026-10-10
    range: [21.3, 24.7]
    range_source: "the per-session ambients fitted on 5-10 Oct (21.3 C on 10 Oct 01:02Z .. 24.7 C on 5 Oct 23:07Z)"
  body_idle_rise_c:
    value: {left_hip_pitch: 6.0, left_hip_roll: 7.0, left_hip_yaw: 8.2, left_knee: 5.2, left_ankle_pitch: 14.5, left_ankle_roll: 17.2, right_hip_pitch: 6.1, right_hip_roll: 7.6, right_hip_yaw: 10.5, right_knee: 10.2, right_ankle_pitch: 10.8, right_ankle_roll: 20.9, waist_roll: 8.3, waist_yaw: 17.3, left_shoulder_pitch: 13.6, left_shoulder_roll: 7.3, left_shoulder_yaw: 12.2, left_elbow: 14.6, left_wrist_roll: 11.1, right_shoulder_pitch: 12.0, right_shoulder_roll: 8.1, right_shoulder_yaw: 17.1, right_elbow: 20.1, right_wrist_roll: 9.1, head_pitch: 11.3, head_yaw: 26.0}
    unit: C
    status: derived
    source: "per motor: the steady rise over the room when powered without load (driver electronics; the head yaw reads ~26 C over the room with a near-zero commanded torque) - A4 fit (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C)"
    date: 2026-10-10
    until: "Tier B (HW1: idle temperatures with the robot hanging, measured tau_est)"
  body_heat_gain_fast:
    value: {hip_pitch: 0.0514, hip_roll: 0.0161, hip_yaw: 0.0309, knee: 0.0213, ankle: 0.0316, waist: 0.0209, shoulder: 0.000826, elbow: 0.0, wrist: 0.0, head: 0.0561}
    unit: C/(N m)^2
    status: derived
    source: "steady rise of the fast pole per (commanded N m)^2, per joint group - A4 fit (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C). 0 = no fast pole found (elbow, wrist: the arm torque is an estimate from tau_ff + the arm gains)"
    date: 2026-10-10
    until: "Tier B (HW1 full-rate tau_est)"
  body_heat_tau_fast_s:
    value: {hip_pitch: 45.0, hip_roll: 5.0, hip_yaw: 45.0, knee: 20.0, ankle: 45.0, waist: 20.0, shoulder: 45.0, elbow: 3.0, wrist: 3.0, head: 45.0}
    unit: s
    status: derived
    source: "fast time constant per joint group, grid 3-45 s - A4 fit (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C). The 45 s values sit at the grid edge (the 5 s windows and the commanded torque blur the fast pole); hip_roll 5 s is set by the 5 Oct take-over spike"
    date: 2026-10-10
    until: "Tier B (HW1 full-rate tau_est)"
  body_heat_gain_slow:
    value: {hip_pitch: 0.0, hip_roll: 0.0672, hip_yaw: 0.481, knee: 0.181, ankle: 0.103, waist: 0.0, shoulder: 0.141, elbow: 0.844, wrist: 0.499, head: 0.00147}
    unit: C/(N m)^2
    status: derived
    source: "steady rise of the slow pole per (commanded N m)^2, per joint group - A4 fit (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C)"
    date: 2026-10-10
    until: "Tier B (HW1 full-rate tau_est)"
  body_heat_tau_slow_s:
    value: {hip_pitch: 1500.0, hip_roll: 900.0, hip_yaw: 3600.0, knee: 2400.0, ankle: 5400.0, waist: 1500.0, shoulder: 1500.0, elbow: 1500.0, wrist: 2400.0, head: 2400.0}
    unit: s
    status: derived
    source: "slow time constant per joint group, grid 180-5400 s - A4 fit (r1sim.tier_a.a4_thermal on v2's 8 Hz telemetry, 5 s windows of the commanded torque^2 (kp (q_cmd - q) + tau_ff; tools/tier_a/a4_extract.py), trained on the 10 sessions 5-8 Oct 2026 (~8.7 h with temperatures), validated on the 6 held-out sessions 9-10 Oct (only their ambient fitted): RMS 0.51-0.97 C per session (worst joint 1.1-2.2 C; with the training mean ambient 0.51-1.05 C); training sessions 0.54-1.19 C)"
    date: 2026-10-10
    until: "Tier B (HW1 full-rate tau_est)"
  hand_ambient_c:
    value: 40.0
    unit: C
    status: derived
    source: "the powered idle hand temperature (hands idle at 38-45 C in the 7-8 Oct logs, App. E §1; the episode fits start from the logged value)"
    date: 2026-10-10
    range: [35.0, 45.0]
    range_source: "idle hands seen 38-45 C; room-cold hands lower"
  hand_heat_exponent:
    value: 1.5
    unit: "-"
